name: CI
on:
  push:
    branches:
      - develop
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: 🪝 pre-commit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Run all pre-commit hooks
        run: uvx prek run --all-files --show-diff-on-failure

  # One job per backend module; the build tree only ever holds one module.
  # The backend tests need live services (Qaptiva host, MQSS services), so the
  # test presets run only tests labelled `unit` and pass when there are none.
  cpp-tests-ubuntu:
    name: 🇨 Build ${{ matrix.module }}
    strategy:
      matrix:
        module: [lrz, eviden]
      fail-fast: false
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      runs-on: ubuntu-26.04
      preset-name: ${{ matrix.module }}
      apt-packages: >-
        libuv1-dev libcjson-dev nlohmann-json3-dev librabbitmq-dev libboost-dev libcurl4-openssl-dev
        libssl-dev

  cpp-linter:
    name: 🇨 Lint
    permissions:
      contents: read
      pull-requests: write
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-linter.yml@4e380c0bb1774aa8b9dd53194f4a7f6575cc3d42 # v2.5.10
    with:
      clang-version: 21
      apt-packages: >-
        libuv1-dev libcjson-dev nlohmann-json3-dev librabbitmq-dev libboost-dev libcurl4-openssl-dev
        libssl-dev

  required-checks-pass: # This job does nothing and is only used for branch protection
    name: 🚦 Check
    if: always()
    needs:
      - pre-commit
      - cpp-tests-ubuntu
      - cpp-linter
    runs-on: ubuntu-26.04
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
